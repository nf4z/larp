name: Luau syntax check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: paradoxum-games/setup-rokit@v3
      - name: Compile larp
        run: |
          cat > check.luau <<'LUA'
          local fs = require("@lune/fs")
          local luau = require("@lune/luau")
          luau.compile(fs.readFile("larp"))
          print("Luau compile OK")
          LUA
          lune run check.luau
